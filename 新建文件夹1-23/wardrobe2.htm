<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>百变忘忧泉-换衣间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f0f0;
            padding: 20px;
        }
        /* 主容器添加背景图片 */
        .main-container {
            position: relative;
            width: 1280px;
            height: auto;
            min-height: 800px;
            margin: 0 auto;
            background-image: url("换衣间更新框架.jpg"); 
            background-size: cover;
            background-repeat: no-repeat;
            padding: 20px;
            border-radius: 10px;
        }
        /* 新增：顶部金币显示样式，固定在右上角 */
        .top-coin-display {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0,0,0,0.5);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .wardrobe-container {
            width: 1280px;
            margin: 0 auto;
            background-color: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        /* 修复音乐按钮：确保路径正确、不被遮挡 */
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        #musicIcon {
            width: 96px;
            height: 85px;
            cursor: pointer;
            display: block; /* 确保图标默认显示 */
        }
        #bgMusic {
            display: none;
        }
        .costume-list {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .costume-item {
            text-align: center;
            width: 200px;
        }
        .costume-img {
            width: 180px;
            height: 220px;
            object-fit: cover;
            border: 2px solid #eee;
            border-radius: 5px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .costume-img:hover {
            border-color: #007bff;
        }
        .costume-info {
            margin-bottom: 10px;
        }
        .costume-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .costume-price {
            font-size: 16px;
            color: #ff4400;
        }
        /* 已拥有个数样式 */
        .owned-count {
            font-size: 14px;
            color: #28a745;
            margin-bottom: 5px;
        }
        .costume-btn {
            width: 120px;
            height: 35px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .costume-btn:hover {
            background-color: #0056b3;
        }
        /* 文字改为按钮样式 */
        .back-btn {
            display: block;
            width: 150px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 0 auto;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <!-- 主容器包裹所有内容，显示背景图片 -->
    <div class="main-container">
        <!-- 新增：顶部剩余金币显示 -->
        <div class="top-coin-display">
            剩余金币：<span id="wardrobeCoin">876590</span>
        </div>

        <!-- 修复音乐按钮：确保路径正确 -->
        <div class="music-control">
            <audio id="bgMusic" src="My Heart Will Go On(DJ)-42换装背景音乐.mp3" loop></audio> <!-- 确认音频路径正确 -->
            <img src="音乐播放键720.png" alt="播放音乐" id="musicIcon"> <!-- 确认图片路径正确 -->
        </div>

        <div class="wardrobe-container">
            <h1 class="title">百变忘忧泉-换衣间</h1>
            <div class="costume-list">
                <!-- 服装1：初始服装（默认已拥有） -->
                <div class="costume-item">
                    <img src="作家+初始原形态的忘忧泉（2）.png" alt="初始作家装" class="costume-img" data-src="作家+初始原形态的忘忧泉（2）.png" data-price="0" data-owned="true">
                    <div class="costume-info">
                        <div class="costume-name">初始作家装</div>
                        <div class="owned-count">已拥有：1件</div>
                        <div class="costume-price">已拥有（免费）</div>
                    </div>
                    <button class="costume-btn" onclick="wearCostume('作家+初始原形态的忘忧泉（2）.png')">穿戴</button>
                </div>
                <!-- 服装2：医生休闲装（需5000金币购买） -->
                <div class="costume-item">
                    <img src="医生忘忧泉2.png" alt="医生服装" class="costume-img" data-src="医生服装-忘忧泉.png" data-price="5000" data-owned="false">
                    <div class="costume-info">
                        <div class="costume-name">医生服装</div>
                        <div class="owned-count">已拥有：0件</div>
                        <div class="costume-price">价格：5000金币</div>
                    </div>
                    <button class="costume-btn" onclick="buyAndWear('医生服装-忘忧泉.png', 5000, this.parentElement)">购买并穿戴</button>
                </div>
                <!-- 服装3：运动装（需8000金币购买） -->
                <div class="costume-item">
                    <img src="运动员忘忧泉2.png" alt="运动装" class="costume-img" data-src="运动装-忘忧泉.png" data-price="8000" data-owned="false">
                    <div class="costume-info">
                        <div class="costume-name">运动服装</div>
                        <div class="owned-count">已拥有：0件</div>
                        <div class="costume-price">价格：8000金币</div>
                    </div>
                    <button class="costume-btn" onclick="buyAndWear('运动装-忘忧泉.png', 8000, this.parentElement)">购买并穿戴</button>
                </div>
                <!-- 服装4：正装（需12000金币购买） -->
                <div class="costume-item">
                    <img src="明星忘忧泉2.png" alt="出道装" class="costume-img" data-src="出道装-忘忧泉.png" data-price="12000" data-owned="false">
                    <div class="costume-info">
                        <div class="costume-name">明星服装</div>
                        <div class="owned-count">已拥有：0件</div>
                        <div class="costume-price">价格：12000金币</div>
                    </div>
                    <button class="costume-btn" onclick="buyAndWear('出道装-忘忧泉.png', 12000, this.parentElement)">购买并穿戴</button>
                </div>
                <!-- 服装5：程序猿装（需35000金币购买） -->
                <div class="costume-item">
                    <img src="程序员忘忧泉2.png" alt="代码装" class="costume-img" data-src="代码装-忘忧泉.png" data-price="35000" data-owned="false">
                    <div class="costume-info">
                        <div class="costume-name">程序员装</div>
                        <div class="owned-count">已拥有：0件</div>
                        <div class="costume-price">价格：35000金币</div>
                    </div>
                    <button class="costume-btn" onclick="buyAndWear('代码装-忘忧泉.png', 35000, this.parentElement)">购买并穿戴</button>
                </div>
                <!-- 服装6：商务装（需60000金币购买） -->
                <div class="costume-item">
                    <img src="商人忘忧泉2.png" alt="商人装" class="costume-img" data-src="商人装-忘忧泉.png" data-price="60000" data-owned="false">
                    <div class="costume-info">
                        <div class="costume-name">商人装</div>
                        <div class="owned-count">已拥有：0件</div>
                        <div class="costume-price">价格：60000金币</div>
                    </div>
                    <button class="costume-btn" onclick="buyAndWear('商人装-忘忧泉.png', 60000, this.parentElement)">购买并穿戴</button>
                </div>
            </div>
            <!-- 文字改为按钮：确认跳转路径与主界面文件名一致 -->
            <button class="back-btn" onclick="window.location.href='A现代养成游戏-我是“权”能王主界面.htm'">返回客厅</button>
        </div>
    </div>
    <script>
        // 初始化：从localStorage加载已拥有服装列表和金币
        let ownedCostumes = JSON.parse(localStorage.getItem('ownedCostumes')) || ['作家+初始原形态的忘忧泉（2）.png'];
        let currentCoin = parseInt(localStorage.getItem('currentCoin')) || 876590;
        const coinDisplay = document.getElementById('wardrobeCoin');

        // 页面加载时更新金币显示和已拥有服装状态
        window.onload = function() {
            // 更新顶部金币显示
            if (coinDisplay) coinDisplay.innerText = currentCoin;

            // 更新已拥有服装状态
            ownedCostumes.forEach(src => {
                const item = document.querySelector(`.costume-img[data-src="${src}"]`);
                if (item) {
                    const parent = item.parentElement;
                    parent.querySelector('.costume-price').innerText = '已拥有（免费）';
                    parent.querySelector('.costume-btn').innerText = '穿戴';
                    parent.querySelector('.costume-btn').setAttribute('onclick', `wearCostume('${src}')`);
                    parent.querySelector('.owned-count').innerText = '已拥有：1件';
                }
            });

            // 初始化音乐按钮事件
            initMusicControl();
        }

        // 修复音乐控制逻辑
        function initMusicControl() {
            const musicIcon = document.getElementById('musicIcon');
            const bgMusic = document.getElementById('bgMusic'); 
            let isMusicPlaying = false;

            if (musicIcon && bgMusic) {
                musicIcon.addEventListener('click', () => {
                    isMusicPlaying = !isMusicPlaying;
                    if (isMusicPlaying) {
                        bgMusic.play().catch(err => console.log('音乐播放失败：', err));
                        musicIcon.src = "音乐暂停键)720.png"; // 修正暂停键图片路径
                    } else {
                        bgMusic.pause(); 
                        musicIcon.src = "音乐播放键720.png";
                    }
                });
            }
        }

        // 购买并穿戴服装函数：实时更新金币显示
        function buyAndWear(costumeSrc, price, item) {
            // 检查是否已拥有
            if (ownedCostumes.includes(costumeSrc)) {
                wearCostume(costumeSrc);
                alert('已拥有该服装，直接穿戴！');
                return;
            }
            // 检查金币是否足够
            if (currentCoin >= price) {
                // 扣除金币并更新显示
                currentCoin -= price;
                localStorage.setItem('currentCoin', currentCoin);
                if (coinDisplay) coinDisplay.innerText = currentCoin;

                // 添加到已拥有列表
                ownedCostumes.push(costumeSrc);
                localStorage.setItem('ownedCostumes', JSON.stringify(ownedCostumes));

                // 穿戴服装
                wearCostume(costumeSrc);

                // 更新按钮状态、价格显示和已拥有个数
                item.querySelector('.costume-price').innerText = '已拥有（免费使用）';
                item.querySelector('.costume-btn').innerText = '穿戴';
                item.querySelector('.costume-btn').setAttribute('onclick', `wearCostume('${costumeSrc}')`);
                item.querySelector('.owned-count').innerText = '已拥有：1件';

                // 提示信息
                alert(`成功购买并穿戴【${item.querySelector('.costume-name').innerText}】，剩余金币：${currentCoin}`);
            } else {
                alert('金币不足，无法购买该服装！');
            }
        }

        // 穿戴服装函数：存储当前穿戴服装到localStorage
        function wearCostume(costumeSrc) {
            localStorage.setItem('wearingCostume', costumeSrc);
            alert('已成功穿戴该服装！');
        }
    </script>
</body>
</html>
